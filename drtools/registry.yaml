# Method capability records.
#
# This file is the agent's knowledge of what each method is for. Claude cannot
# introspect scikit-learn, so anything it needs in order to choose sensibly has to be
# declared here: what a method preserves, what it assumes, what it destroys, where it
# stops scaling, and how it fails.
#
# Three consumers read it. The planner reasons over it when selecting candidates; the
# plan validator enforces the hard constraints; the rule-based planner branches on the
# same fields. One source of truth, so the LLM path and the no-LLM path cannot drift
# apart in what they believe about a method.
#
# Adding a method takes an entry here and one executor function, and no skill edits.
# Every property a check reads is declared in the entry: the class, whether the method
# works through Euclidean geometry, whether it is nested in d, whether it needs a
# connected graph, its emphasis, how it reaches new rows, and the named limits on d it
# obeys, and how it is tuned: the one fidelity parameter tuning scales by a multiplier
# (`param`), whether the value scaled is a suggestion or the executor's own rule
# (`base`), when the parameter applies at all (`applies`), and what chooses its d
# (`criterion`): one of the method's own criteria, the battery, or `fixed` for a
# visualization method, which runs at d = 2. A method may also bring a suggestion rule
# or a check on its own parameters;
# tests/test_extension_point.py lists every place outside the executors that names a
# method, and why a new method can be absent from each.

version: 1

ops:

  # ----------------------------------------------------------------- preprocessing

  drop_constant:
    kind: preprocessing
    summary: Remove features constant by the range test, max - min <= 1e-12 * max(1, max |x|).
    rationale: >
      Constant features carry no information and make standardisation divide by zero.
      The range, not the variance, is tested: a floating-point variance is rarely exactly
      zero for a constant column, and a z-score would turn its rounding error into a
      feature of unit variance. Always the first stage of the base preprocessing.
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params: {}

  normalise_total:
    kind: preprocessing
    summary: Rescale each sample so its feature total matches a common target.
    rationale: >
      For count data the sample total is sequencing depth, a technical quantity. Left
      in, it becomes the dominant axis of variation in any distance-based embedding,
      and the leading component measures how deeply a cell was sequenced rather than
      what it is.
    assumes: >
      Total magnitude is technical rather than biological. False for data where the
      total is the signal, such as absolute abundance.
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params:
      target:
        type: float
        default: null
        default_rule: median sample total
        describes: common total to scale every sample to; left null, the median sample total

  log1p:
    kind: preprocessing
    summary: Apply log(1 + x) elementwise.
    rationale: >
      Counts are heteroscedastic: variance grows with the mean, so without a
      variance-stabilising transform the highest-expressed features dominate every
      Euclidean distance regardless of how informative they are.
    assumes: non-negative input
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params: {}

  standardise:
    kind: preprocessing
    summary: Centre each feature to zero mean and unit variance.
    rationale: >
      Puts features on a comparable scale so that no feature dominates a distance
      purely because it was measured in larger units.
    caution: >
      Accepts sparse input and returns it dense, since centring makes every zero
      non-zero: on a wide sparse matrix megabytes become gigabytes, and the plan
      validator counts that dense output against the memory limit. Keeps the input's
      dtype. It also inflates noise in near-constant features, which is why
      drop_constant belongs before it.
    handles_sparse: true
    preserves_sparsity: false
    deterministic: true
    params: {}

  l2_normalise:
    kind: preprocessing
    summary: Scale each sample to unit L2 norm.
    rationale: >
      Makes Euclidean distance monotonic in cosine distance, which is often the right
      similarity for high-dimensional non-negative data where direction matters more
      than magnitude.
    caution: undefined for all-zero samples, which must be dropped first
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params: {}

  select_variable_features:
    kind: preprocessing
    summary: Keep the most variable features and discard the rest.
    rationale: >
      In wide data most features are noise. Restricting to the variable ones improves
      the signal-to-noise of every downstream distance and cuts cost substantially.
    caution: >
      Selection is made on the current representation, so it belongs after
      normalisation and log1p rather than before, or it will simply select the
      highest-expressed features.
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params:
      n_features:
        type: int
        default: 2000
        min: 2
        describes: >
          how many features to retain, ranked by variance; registration requires
          exactly 2000 wherever section 3.10's rule selects

  densify:
    kind: preprocessing
    summary: Convert a sparse matrix to a dense array.
    rationale: Many methods require dense input; making that explicit keeps the memory cost visible.
    caution: cost is n_samples * n_features * 8 bytes, which the planner should check first
    handles_sparse: true
    preserves_sparsity: false
    deterministic: true
    params: {}

  subsample:
    kind: preprocessing
    summary: Draw a stratified subsample of the rows the later stages are fitted on.
    rationale: >
      The honest way to run a quadratic method on data too large for it. The stages
      after it are fitted on the rows kept, and every other row is projected through
      the fitted stages, so the candidate's embedding still covers every row and is
      scored on the same rows as every other candidate.
    caution: >
      Thins neighbourhoods, so the fit learns local structure from fewer rows than the
      data holds, and a poor projection of the other rows costs the candidate in the
      ranking. Allowed only where the method would otherwise exceed its scales_to or
      the run's memory limit.
    handles_sparse: true
    preserves_sparsity: true
    deterministic: true
    params:
      n_samples:
        type: int
        default: 5000
        min: 10
        describes: target sample count; stratified by label when labels exist

  # ------------------------------------------------------------------ linear methods

  pca:
    kind: reduction
    family: linear
    roles: [intermediate, terminal]
    summary: Principal component analysis.
    preserves: >
      Global variance structure, and Euclidean distances within the retained subspace.
      Component scores are interpretable and the projection extends exactly to new data.
    assumes: the structure of interest lies along directions of high variance
    distorts: >
      Nonlinear structure. A curved manifold projects to a smear, and a spiral or roll
      is flattened onto itself rather than unrolled.
    reading:
      distances: >
        Straight-line distances on the plot are the data's distances projected onto the
        two directions of greatest variance. Projection only shrinks them, so two points
        close on the plot may be far apart in directions not shown.
      gaps: >
        A gap is real separation along the directions shown. Groups that overlap may still
        be separate in directions not shown.
      sizes: >
        A group's spread is its variance along the directions shown, on one scale for
        every group.
    handles_sparse: true
    sparse_note: >
      Sparse input uses TruncatedSVD, which does not centre. The result is then an SVD
      of the uncentred matrix, not strictly PCA, and its leading component often tracks
      sample magnitude.
    complexity: O(n d k) with a randomised solver
    scales_to: 2000000
    stochastic: false
    euclidean: true
    nested_in_d: true
    tuning:
      param: null
      criterion: explained_variance
    requires_connected_graph: false
    emphasis: global
    new_rows: transform
    params:
      n_components:
        type: int
        default: 2
        min: 1
        describes: output dimension; bounded by min(n_samples, n_features)
      whiten:
        type: bool
        default: false
        describes: rescale components to unit variance, discarding relative scale
    fails_when: []

  kernel_pca:
    kind: reduction
    family: linear/kernel
    roles: [terminal]
    summary: PCA in a feature space induced by a kernel.
    preserves: structure that is linear after the kernel map, so some nonlinear structure
    assumes: a kernel whose induced geometry suits the data; the choice matters more than the tuning
    distorts: >
      Interpretability. Components live in feature space and have no expression in the
      original variables.
    reading:
      distances: >
        Distances are the kernel's feature-space distances, projected onto its two leading
        directions. With the RBF kernel every pair further apart than the kernel width
        looks similarly far, so large distances are compressed.
      gaps: >
        A gap is separation in the kernel's feature space along the directions shown.
      sizes: >
        A group's spread is its variance in feature space, which with the RBF kernel
        depends on the width as much as on the group.
    handles_sparse: true
    complexity: O(n^2 d) to build the kernel, O(n^3) to decompose it
    scales_to: 10000
    stochastic: false
    euclidean: {when: {kernel: [rbf]}}
    nested_in_d: true
    tuning:
      param: gamma
      base: rule
      applies: {when: {kernel: [rbf, sigmoid, poly]}}
      criterion: kernel_variance
    requires_connected_graph: false
    emphasis: null
    emphasis_reason: >
      Which distances it keeps depends on the kernel and its width: close to PCA, and so
      global, with a wide RBF kernel; mainly neighbours with a narrow one. Reopen when
      tuning shows its chosen widths consistently favour one side.
    new_rows: transform
    params:
      n_components: {type: int, default: 2, min: 1}
      kernel:
        type: str
        default: rbf
        choices: [rbf, poly, cosine, sigmoid]
      gamma:
        type: float
        default: null
        default_rule:
          - {when: {kernel: [rbf, sigmoid]}, rule: median pairwise distance heuristic}
          - {when: {kernel: [poly]}, rule: "1/n_features (scikit-learn default)"}
          - {when: {kernel: [cosine]}, rule: not applicable}
        describes: >
          kernel width, used by the rbf, sigmoid and poly kernels. Left null, rbf and
          sigmoid take the reciprocal of the median squared pairwise distance, measured
          on up to 1,000 sampled rows, which puts the width where the kernel varies;
          poly takes scikit-learn's 1/n_features; cosine has no width. The stage record's
          gamma_source says which rule ran.
      width_multiplier:
        type: float
        default: 1.0
        min: 0.0
        describes: >
          set by tuning, never by a plan: the multiplier applied to the width, whether
          it comes from the rule or from an explicit value, so that the multiplier
          chosen on the tuning rows is applied to the width recomputed on the rows the
          refit sees.
    fails_when:
      - n_samples above roughly 10000, where the dense kernel matrix exhausts memory

  sparse_pca:
    kind: reduction
    family: linear/sparse
    roles: [terminal]
    summary: PCA with an L1 penalty, giving components that load on few features.
    preserves: variance structure, subject to a sparsity constraint on the loadings
    assumes: the signal is carried by a small subset of features
    distorts: >
      Orthogonality and the variance ordering. Components are no longer orthogonal and
      no longer ranked by explained variance, so they cannot be read like PCA's.
    reading:
      distances: >
        Distances are taken over a few sparse components, each built from few features.
        The components need not be orthogonal, so the plot is not an exact projection and
        distances along one axis leak into the other.
      gaps: >
        A gap is separation along the features the components select. Groups that differ
        only in other features overlap.
      sizes: >
        A group's spread is its variance along the sparse components, on one scale for
        every group.
    handles_sparse: false
    complexity: iterative dictionary learning; substantially slower than PCA
    scales_to: 50000
    stochastic: true
    euclidean: true
    # Not measured. Declared false, which costs a refit at every d and never overstates
    # fidelity; a claim of true would have to pass tests/test_nested_in_d.py.
    nested_in_d: false
    tuning:
      param: null
      criterion: battery
    requires_connected_graph: false
    emphasis: global
    new_rows: transform
    params:
      n_components: {type: int, default: 2, min: 1}
      alpha:
        type: float
        default: 1.0
        min: 0.0
        describes: sparsity penalty; larger gives fewer non-zero loadings
    fails_when: []

  # ---------------------------------------------------------------- spectral methods

  laplacian_eigenmaps:
    kind: reduction
    family: spectral/graph
    roles: [terminal]
    summary: Eigenvectors of the graph Laplacian of a neighbourhood graph.
    preserves: >
      Local neighbourhood structure. Points that are neighbours in the graph stay close
      in the embedding.
    assumes: >
      The data lies on a manifold sampled densely enough that a k-NN graph approximates
      it, and that the graph is connected.
    distorts: >
      Global distances entirely; only the local graph structure is represented. Scale is
      arbitrary.
    reading:
      distances: >
        Only neighbourhoods are kept: points joined in the graph are placed near each
        other. Distances between points that are not neighbours mean nothing.
      gaps: >
        Groups weakly joined in the graph are pushed apart, and the width of the gap does
        not measure how different they are.
      sizes: >
        The coordinates carry no eigenvalue weight, so a group's spread says nothing about
        its spread in the data.
    handles_sparse: true
    complexity: O(n k) to build the graph, then a sparse eigenproblem
    scales_to: 50000
    stochastic: true
    euclidean: true
    nested_in_d: true
    tuning:
      param: n_neighbors
      base: suggestion
      criterion: eigengap
    requires_connected_graph: true
    emphasis: local
    new_rows: nystrom
    params:
      n_components: {type: int, default: 2, min: 1}
      n_neighbors:
        type: int
        default: 15
        min: 2
        describes: neighbours per node; must be large enough to connect the graph
    fails_when:
      - the k-NN graph is disconnected, which makes the trailing eigenvectors indicator
        functions of components rather than coordinates

  diffusion_maps:
    kind: reduction
    family: spectral/diffusion
    roles: [terminal]
    summary: Coordinates from the eigendecomposition of a diffusion operator on the data.
    preserves: >
      Diffusion distance, which measures connectivity through the data rather than
      straight-line proximity. Robust to noise because it averages over all paths.
    assumes: a manifold, plus a kernel bandwidth matched to the sampling density
    distorts: >
      The embedding depends on diffusion time t; different t give different and equally
      valid geometries, so t must be reported alongside the result.
    reading:
      distances: >
        Distances are diffusion distances: two points are close when random walks from
        them reach the same places, so points joined by many short paths are close even
        when far apart in the data.
      gaps: >
        A gap means few paths between the groups at this diffusion time. A longer time
        merges groups.
      sizes: >
        Spread shrinks as the diffusion time grows, and dense groups contract, so a
        group's size is not its spread in the data.
    handles_sparse: false
    complexity: O(n^2) memory for the dense kernel, O(n^3) to decompose
    scales_to: 10000
    stochastic: false
    euclidean: true
    nested_in_d: true
    tuning:
      param: epsilon
      base: rule
      criterion: diffusion_distance
      # Swept on every fit at no cost: the coordinates are psi * lambda**t from one
      # decomposition, so each t in the plan's t_grid is a rescaling, not a refit.
      swept: t
    requires_connected_graph: false
    emphasis: global
    new_rows: nystrom
    params:
      n_components: {type: int, default: 2, min: 1}
      epsilon:
        type: float
        default: null
        default_rule: kernel-sum scaling criterion (Coifman and Singer)
        describes: >
          kernel bandwidth. Left null, it is chosen by Coifman and Singer's kernel-sum
          scaling criterion: the lower edge of the range of bandwidths over which the log
          kernel sum rises linearly with log bandwidth, where the kernel has just begun to
          resolve the manifold. The stage record's epsilon_source says so, and
          dimension_implied_by_bandwidth reports the intrinsic dimension the slope implies.
      alpha:
        type: float
        default: 1.0
        min: 0.0
        max: 1.0
        describes: >
          density normalisation. 0 keeps the density in the operator, 1 removes it and
          recovers the Laplace-Beltrami operator of the manifold, 0.5 is Fokker-Planck
      t:
        type: int
        default: 1
        min: 1
        describes: diffusion time; larger t emphasises coarser structure
      width_multiplier:
        type: float
        default: 1.0
        min: 0.0
        describes: >
          set by tuning, never by a plan: the multiplier applied to the width, whether
          it comes from the rule or from an explicit value, so that the multiplier
          chosen on the tuning rows is applied to the width recomputed on the rows the
          refit sees.
    fails_when:
      - n_samples above roughly 10000, where the dense kernel matrix exhausts memory

  # ------------------------------------------------------------------ manifold

  mds:
    kind: reduction
    family: manifold/global
    roles: [terminal]
    summary: Place points so that embedded distances match the original distances.
    preserves: >
      Pairwise distances directly, which makes it the most literal reading of "the
      structure" and the easiest embedding to interpret: distance on the plot means
      distance in the data.
    assumes: >
      That the original distance matrix is meaningful in the first place. In high
      dimensions distances concentrate, and MDS will faithfully reproduce a
      concentration artefact.
    distorts: >
      Local detail, when global fit demands it. Non-metric MDS preserves only the rank
      order of distances, which is more robust but discards their magnitudes.
    reading:
      distances: >
        Distances approximate the data's pairwise distances as a whole, as far as the
        stress reported allows. Large distances dominate that fit, so the smallest are the
        least accurate.
      gaps: >
        A gap reflects real separation, within the stress.
      sizes: >
        A group's spread approximates its spread in the data.
    handles_sparse: false
    complexity: O(n^2) memory, iterative SMACOF
    scales_to: 5000
    stochastic: true
    euclidean: true
    nested_in_d: false
    tuning:
      param: null
      criterion: stress
    requires_connected_graph: false
    emphasis: global
    new_rows: none
    params:
      n_components: {type: int, default: 2, min: 1}
      metric:
        type: bool
        default: true
        describes: >
          true fits distances themselves; false fits only their rank order, which suits
          data whose distances are ordinal rather than quantitative
      n_init:
        type: int
        default: 4
        min: 1
        describes: restarts, since SMACOF converges to local minima
    fails_when:
      - n_samples above roughly 5000, where the dense distance matrix and the iteration
        cost together become impractical

  isomap:
    kind: reduction
    family: manifold/global
    roles: [terminal]
    summary: MDS on geodesic distances measured along a neighbourhood graph.
    preserves: >
      Global geodesic structure. Distance is measured along the manifold rather than
      through the ambient space, which is what lets it unroll a curved surface.
    assumes: >
      A single connected, densely sampled manifold with no holes. Every one of those
      conditions is load-bearing.
    distorts: >
      Everything, if the graph is wrong. A single spurious edge between distant parts of
      the manifold short-circuits the geodesic and corrupts the whole embedding, not
      just its neighbourhood.
    reading:
      distances: >
        Distances approximate geodesic distances along the neighbourhood graph, not
        straight-line ones: points close on the plot are close along the data's manifold.
      gaps: >
        A gap is real separation, or a break in the neighbourhood graph. When the graph is
        disconnected the placement of its pieces relative to each other means nothing.
      sizes: >
        A group's spread is its geodesic spread, comparable across groups when the graph
        is connected.
    handles_sparse: false
    complexity: O(n^2 log n) for all-pairs shortest paths, O(n^2) memory
    scales_to: 5000
    stochastic: false
    euclidean: true
    nested_in_d: true
    tuning:
      param: n_neighbors
      base: suggestion
      criterion: residual_variance
    requires_connected_graph: true
    emphasis: global
    new_rows: transform
    params:
      n_components: {type: int, default: 2, min: 1}
      n_neighbors:
        type: int
        default: 10
        min: 2
        describes: >
          graph degree; too small disconnects the graph, too large creates short-circuit
          edges that bridge folds of the manifold
    fails_when:
      - the neighbourhood graph is disconnected, leaving infinite geodesic distances
      - n_samples above roughly 5000, where all-pairs shortest paths dominate the runtime

  lle:
    kind: reduction
    family: manifold/local
    roles: [terminal]
    summary: Locally linear embedding, reconstructing each point from its neighbours.
    preserves: >
      Local linear reconstruction weights: whatever combination of its neighbours
      describes a point in the original space should describe it in the embedding.
    assumes: the manifold is locally linear at the scale set by n_neighbors
    distorts: >
      Global structure entirely, and the standard variant is prone to collapsing whole
      regions toward a point when the local weight problem is ill-conditioned.
    reading:
      distances: >
        Only each point's reconstruction from its neighbours is kept. Distances beyond a
        neighbourhood mean nothing.
      gaps: >
        A gap may be real separation or a failure of the neighbourhood graph, and a wrong
        neighbourhood can fold parts of the data onto lines.
      sizes: >
        The coordinates are normalised to unit covariance, so a group's spread means
        nothing.
    handles_sparse: false
    complexity: O(n k^3) for the weights, then a sparse eigenproblem
    scales_to: 20000
    stochastic: true
    euclidean: true
    nested_in_d: {when: {method: [standard]}}
    tuning:
      param: n_neighbors
      base: suggestion
      criterion: battery
    requires_connected_graph: true
    emphasis: local
    new_rows: transform
    d_limits: [lle_neighbour_minimum]
    params:
      n_components: {type: int, default: 2, min: 1}
      n_neighbors:
        type: int
        default: 12
        min: 2
        describes: >
          neighbourhood size defining "locally linear", and the parameter LLE is most
          sensitive to. Measured on a noise-free Swiss roll at n = 1000, every variant
          recovered the roll parameter at rho = 1.00 for k between 6 and 12, fell to
          around 0.9 at k = 16, and collapsed to between 0.01 and 0.46 by k = 24: once
          a neighbourhood spans two folds of the manifold, "locally linear" is false and
          the reconstruction weights are meaningless. Prefer small values, and smaller
          still when the data is noisy or sparsely sampled.
      method:
        type: str
        default: standard
        choices: [standard, modified, hessian, ltsa]
        describes: >
          standard is the original and the least stable; modified uses several weight
          vectors per neighbourhood and largely fixes its regularisation problem;
          hessian and ltsa estimate the local tangent space and handle curvature better
          but require more neighbours
    fails_when:
      - a disconnected neighbourhood graph
      - n_neighbors too small for the chosen variant, each of which requires a different
        minimum relative to n_components

  # --------------------------------------------------------- neighbour embeddings

  tsne:
    kind: visualization
    family: neighbour_embedding
    roles: [terminal]
    summary: t-distributed stochastic neighbour embedding.
    preserves: >
      Local neighbourhoods, and it is very good at them. Points that are near in the
      data end up near in the plot.
    assumes: >
      That local neighbourhood membership is what matters, and that a perplexity matched
      to the data's density can be chosen.
    distorts: >
      Global structure, thoroughly and in ways that invite misreading. Cluster sizes
      carry no meaning, distances between clusters carry no meaning, and apparent gaps
      may be artefacts of the optimisation. Any interpretation that reads the layout as
      a map is wrong.
    reading:
      distances: >
        Distances between well-separated groups mean nothing. Only who sits next to whom
        within a group is kept.
      gaps: >
        The width of a gap does not measure how different two groups are, and a gap can
        appear where the data has none.
      sizes: >
        Each point's bandwidth adapts to its local density, so dense and sparse groups are
        drawn at similar sizes: a group's size says nothing about its spread.
    handles_sparse: false
    complexity: O(n log n) with the FFT-accelerated gradient
    scales_to: 500000
    stochastic: true
    euclidean: true
    nested_in_d: false
    tuning:
      param: perplexity
      base: suggestion
      criterion: fixed
    requires_connected_graph: false
    emphasis: local
    new_rows: transform
    params:
      n_components: {type: int, default: 2, min: 1}
      perplexity:
        type: float
        default: 30.0
        min: 2.0
        describes: >
          effective neighbourhood size; must stay well below n/3 or the neighbourhood
          spans the whole dataset and the embedding degenerates
      initialization:
        type: str
        default: pca
        choices: [pca, random, spectral]
        describes: >
          PCA initialisation makes the result reproducible and retains some global
          arrangement; random initialisation discards it
      n_iter:
        type: int
        default: 500
        min: 50
    fails_when:
      - perplexity at or above n_samples / 3

  umap:
    kind: visualization
    family: neighbour_embedding
    roles: [terminal]
    summary: Uniform manifold approximation and projection.
    preserves: >
      Local neighbourhoods, with more global arrangement retained than t-SNE, and fast
      enough to run on data where the alternatives are not.
    assumes: >
      Locally uniform sampling on a manifold. Where density varies sharply that
      assumption is violated and the layout distorts accordingly.
    distorts: >
      Inter-cluster distances, which are more meaningful than t-SNE's but still not
      metric. min_dist controls how tightly points pack and is a display choice rather
      than a property of the data.
    reading:
      distances: >
        Distances between groups are kept better than by t-SNE but are still not to scale.
        Within a group, neighbourhood membership is what is kept.
      gaps: >
        The width of a gap does not measure dissimilarity; min_dist and the graph's
        connectivity shape it.
      sizes: >
        Local distances are normalised point by point, so density is largely lost and a
        group's size says little about its spread.
    handles_sparse: true
    complexity: approximate nearest neighbours, then stochastic optimisation
    scales_to: 1000000
    stochastic: true
    euclidean: {when: {metric: [euclidean]}}
    # A smaller fit agrees with a larger one only through the spectral initialiser,
    # which is itself nested; under random initialisation it does not (section 3.5).
    nested_in_d: false
    tuning:
      param: n_neighbors
      base: suggestion
      criterion: fixed
    requires_connected_graph: false
    emphasis: local
    new_rows: transform
    params:
      n_components: {type: int, default: 2, min: 1}
      n_neighbors:
        type: int
        default: 15
        min: 2
        describes: >
          balance between local and global structure; small values fragment the manifold
          into local patches, large values blur fine structure
      min_dist:
        type: float
        default: 0.1
        min: 0.0
        max: 0.99
        describes: >
          minimum separation in the embedding; purely a visual packing parameter with no
          bearing on what the data is like
      metric:
        type: str
        default: euclidean
        choices: [euclidean, cosine, correlation, manhattan]
    fails_when:
      - n_neighbors at or above n_samples
